name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install

      - run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_APP_NAME: ${{ secrets.APP_NAME }}
          NEXT_PUBLIC_APP_NAME_AR: ${{ secrets.APP_NAME_AR }}
          NEXT_PUBLIC_APP_NAME_DISPLAY: ${{ secrets.APP_NAME_DISPLAY }}
          NEXT_PUBLIC_APP_EMAIL: ${{ secrets.APP_EMAIL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.APP_URL }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ secrets.APP_DOMAIN }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
